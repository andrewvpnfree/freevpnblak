name: Update VPN Configs Every 5 Hours

on:
  schedule:
    # Запуск каждые 5 часов (в 0 минут выбранного часа)
    - cron: '0 */5 * * *'
  workflow_dispatch:
    # Оставляет возможность запустить обновление вручную в любое время

permissions:
  contents: write

jobs:
  download-configs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4

      - name: Download VLESS configs
        run: |
          python3 -c '
          import urllib.request
          import time
          import ssl

          url = "https://githubusercontent.com"
          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"})
          
          # Отключаем строгую проверку SSL на случай проблем с сертификатами в контейнере
          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE

          for attempt in range(5):
              try:
                  print(f"Попытка скачивания {attempt + 1}...")
                  with urllib.request.urlopen(req, context=ctx, timeout=20) as response:
                      with open("vless_configs.txt", "wb") as f:
                          f.write(response.read())
                  print("Файл успешно скачан!")
                  break
              except Exception as e:
                  print(f"Ошибка при скачивании: {e}")
                  if attempt < 4:
                      time.sleep(3)
                  else:
                      raise e
          '

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vless_configs.txt
          if ! git diff --cached --quiet; then
            git commit -m "Автоматическое обновление конфигураций VLESS (черный список)"
            git push
          else
            echo "Изменений нет, пуш не требуется."
          fi
