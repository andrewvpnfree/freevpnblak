name: Update VPN Configs Every 5 Hours

on:
  schedule:
    # Запуск каждые 5 часов (в 0 минут выбранного часа)
    - cron: '0 */5 * * *'
  workflow_dispatch:
    # Оставляет возможность запустить обновление вручную в любое время

permissions:
  contents: write

jobs:
  download-configs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4

      - name: Download VLESS configs
        run: |
          python3 -c '
          import urllib.request
          import socket
          import time

          # Принудительно используем IPv4 для стабильности сети
          old_getaddrinfo = socket.getaddrinfo
          def new_getaddrinfo(*args, **kwargs):
              responses = old_getaddrinfo(*args, **kwargs)
              return [r for r in responses if r[0] == socket.AF_INET]
          socket.getaddrinfo = new_getaddrinfo

          url = "https://githubusercontent.com"
          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})

          # Делаем до 5 попыток скачивания при сетевых сбоях
          for attempt in range(5):
              try:
                  print(f"Попытка скачивания {attempt + 1}...")
                  with urllib.request.urlopen(req, timeout=15) as response:
                      with open("vless_configs.txt", "wb") as f:
                          f.write(response.read())
                  print("Файл успешно скачан!")
                  break
              except Exception as e:
                  print(f"Ошибка при скачивании: {e}")
                  if attempt < 4:
                      time.sleep(3)
                  else:
                      raise e
          '

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vless_configs.txt
          if ! git diff --cached --quiet; then
            git commit -m "Автоматическое обновление конфигураций VLESS (черный список)"
            git push
          else
            echo "Изменений нет, пуш не требуется."
          fi
